name: LiVerse checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run full regression suite
        run: make test

  install:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LiVerse with Windows updater
        shell: powershell
        env:
          LIVERSE_TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "LiVerse"
          .\update-liverse-windows.ps1 `
            -TargetDir $target `
            -RepoUrl "https://github.com/${{ github.repository }}.git" `
            -Branch $env:LIVERSE_TEST_BRANCH

      - name: Verify installed LiVerse
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "LiVerse"
          & "$target\.venv\Scripts\python.exe" -c "import vosk, sounddevice, bible_parser_core; print('Import check OK')"
